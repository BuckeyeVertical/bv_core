# SUAS 2026 simulation mission. Official lap waypoints are released at check-in.
# This 1.96-mile route stays inside the published flight boundary.

enable_mission_log: true
num_objects: 2

takeoff_alt: 60.96            # AGL, relative to the takeoff point
scan_altitude: 60.96          # AGL, relative to the takeoff point
lap_count: 0

# mission_node pushes the lap route in MAV_FRAME_GLOBAL (AMSL). SITL runs
# with PX4_HOME_ALT=0 (see README), so AMSL and AGL coincide here and this
# matches takeoff_alt. Raise lap_count above 0 to actually fly the lap.
lap_alt_msl: &LAP_MSL 60.96   # AMSL

# One counter-clockwise lap; mission_node closes and repeats it.
points:
  - [36.21531017, -96.00994545, *LAP_MSL]
  - [36.21362892, -96.00981991, *LAP_MSL]
  - [36.21359247, -96.00813694, *LAP_MSL]
  - [36.21142292, -96.00821104, *LAP_MSL]
  - [36.21146430, -96.00483924, *LAP_MSL]
  - [36.21645553, -96.00483924, *LAP_MSL]
  - [36.21883578, -96.00271530, *LAP_MSL]
  - [36.21961682, -96.00447978, *LAP_MSL]
  - [36.21998623, -96.00686465, *LAP_MSL]
  - [36.21980137, -96.00921336, *LAP_MSL]
  - [36.21911447, -96.01129465, *LAP_MSL]
  - [36.21808622, -96.01282681, *LAP_MSL]

scan_boundary:
  - [36.216341, -96.010424]
  - [36.216750, -96.007550]
  - [36.218054, -96.007835]
  - [36.217645, -96.010709]

Lap_velocity: 20.0
Scan_transit_velocity: 20.0
Takeoff_velocity: 15.0
Scan_velocity: 4.0
Deliver_velocity: 3.0
RTL_velocity: 20.0

Lap_tolerance: 45.0
Scan_tolerance: 1.0
Deliver_tolerance: 1.0

# ------------------------------------------------------------
# PAYLOAD RELEASE (bv_core/payload.py, docs/HITL/payload.md)
# ------------------------------------------------------------
# Sim has no payload servos, but enabling this still runs the whole drop: the
# commands reach PX4 SITL and the aircraft holds for the full sequence.
# Set false to skip the drop (DEPLOY then resumes the scan immediately).
payload:
  enabled: true

  # Pulse widths in microseconds, measured on QGC's Actuators page (type a
  # value into the output's disarmed field, watch the servo). 50 Hz outputs.
  # See docs/HITL/payload.md.

  # Plate: sits under both payloads and holds them up.
  plate:
    actuator_set: 2          # PWM_MAIN_FUNCn = 302 (Peripheral via Actuator Set 2)
    pwm_range_us: [800, 2200]  # MUST equal PWM_MAIN_MINn / PWM_MAIN_MAXn
    hold_us: 1685            # both payloads held
    beacon_drop_us: 1360     # drops the beacon (tent)
    bottle_drop_us: 2050     # drops the bottle (person)

  # Clamp: grips the line to slow the fall; holds nothing up.
  clamp:
    actuator_set: 1          # PWM_MAIN_FUNCn = 301 (Peripheral via Actuator Set 1)
    pwm_range_us: [800, 2200]  # MUST equal PWM_MAIN_MINn / PWM_MAIN_MAXn
    unclamped_us: 1900       # open; also its position at rest
    bottle_clamped_us: 1577  # gripping for the water bottle
    beacon_clamped_us: 1710  # gripping for the beacon

  # The clamp starts braking this long before the plate moves, while the
  # plate still holds (toggling at the first phase's interval). It comes on
  # top of brake_phases; it doesn't shorten them.
  pre_drop_s: 1.0

  # Once the plate moves, the clamp toggles clamped <-> unclamped every
  # toggle_ms for duration_s, phase after phase, in one continuous rhythm.
  # Each payload has its own list; duration_s: 0 skips a phase. The starting
  # times were worked out for a 150 ft drop as 75 ft at 15 ft/s, 50 ft at
  # 13.3 ft/s and 25 ft at 12.5 ft/s. Bench runs can override one payload's
  # list: ros2 run bv_core test_servo drop bottle 150:3
  brake_phases:
    bottle:
      - {duration_s: 5.0,  toggle_ms: 200}
      - {duration_s: 3.76, toggle_ms: 150}
      - {duration_s: 2.0,  toggle_ms: 100}
    beacon:
      - {duration_s: 5.0,  toggle_ms: 200}
      - {duration_s: 3.76, toggle_ms: 150}
      - {duration_s: 2.0,  toggle_ms: 100}

Approval_required: true
Approval_timeout_sec: 180.0
