# ============================================================
# VISION PARAMETERS
# ============================================================

# Detection settings
detection_threshold: 0.5
num_scan_wp: 3

# Stitching frame capture
stitch_overlap: 0.35

# Detector configuration
detector_type: "ml"  # Options: "ml" (LightlyTrain LTDETR), "gazebo_bbox" (Gazebo bounding box camera)
ml_model_path: "/bv_ws/ltdetr.pt"  # LTDETR checkpoint inside the mission container
gazebo_bbox_topic: "/camera/bounding_boxes"  # Topic for Gazebo bbox camera (only used when detector_type is "gazebo_bbox")
sahi_slice_sizes:
  bevy: [530, 530]       # Real-camera 1920px tiles scaled to Bevy resolution
  real: [1920, 1920]
  ros: [1920, 1920]
  sim: [530, 530]
sahi_overlap: 0.2

# ============================================================
# PIPELINE CONFIGURATION
# ============================================================

# Pipeline type: 'sim', 'bevy', 'real', or 'ros'
pipeline_type: 'bevy'

# Gazebo simulation settings (used when pipeline_type: 'sim')
# Change this if drone or world changes
gz_topic: '/camera/bounding_boxes_image'

# Bevy camera stream settings (used when pipeline_type: 'bevy')
bevy_host: 'host.docker.internal'
bevy_port: 7002

# Real camera settings (used when pipeline_type: 'real')
gst_pipeline: 'v4l2src device=/dev/video0 ! image/jpeg, width=4640, height=3480, framerate=8/1 ! jpegdec ! videoconvert ! appsink drop=true sync=false'
camera_fps: 8.0
record_video: True

# ROS topic subscription (used when pipeline_type: 'ros') - for rosbag playback
ros_image_topic: '/image_compressed'

# ============================================================
# Operator review crop (human-in-the-loop approval)
# Window around the detection sent to the ground station. Adaptive because the
# real camera (4640px) and the sim (1280px) put a person at wildly different
# pixel heights; see docs/superpowers/specs/2026-08-05-hitl-mission-wiring-design.md
# ============================================================
crop_margin_factor: 2.5    # context multiplier on the bounding box
crop_min_px: 320           # floor, so a small sim detection still gets context
crop_max_px: 1024          # ceiling on the longest output side
crop_jpeg_quality: 85

# ============================================================
# Debug preview stream (GCS live feed)
# Off until the operator toggles it on in the ground station. See
# docs/superpowers/specs/2026-08-06-debug-video-stream-design.md
# ============================================================
# Deliberately conservative: the Herelink budget is unknown and this is a debug
# feed, not a camera downlink. Raise once the link has actually been measured.
preview_width: 640           # output width; height follows source aspect
preview_fps: 12.0             # decimation target — the knob for CPU and bitrate
preview_bitrate_bps: 500000  # encoder target bitrate
