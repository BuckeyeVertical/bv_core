# SUAS 2026 real flight mission. Official lap waypoints are released at check-in.
# This 1.96-mile route stays inside the published flight boundary.

enable_mission_log: true
num_objects: 2

takeoff_alt: &TAKEOFF 45.72
scan_altitude: 45.72
lap_count: 2

# One counter-clockwise lap; mission_node closes and repeats it.
points:
  - [40.15920833, -83.19985278, *TAKEOFF]
  - [40.15777778, -83.19985278, *TAKEOFF]
  - [40.15777778, -83.19580278, *TAKEOFF]
  - [40.15920833, -83.19580278, *TAKEOFF]
  - [40.15920833, -83.19985278, *TAKEOFF]

scan_sweep: long
scan_start: bottom
scan_boundary:
  - [40.15920833, -83.19985278]
  - [40.15777778, -83.19985278]
  - [40.15777778, -83.19580278]
  - [40.15920833, -83.19580278]

Lap_velocity: 12.0
Scan_transit_velocity: 8.0
Takeoff_velocity: 8.0
Scan_velocity: 3.0
Deliver_velocity: 3.0
RTL_velocity: 8.0

Lap_tolerance: 40.0
Scan_tolerance: 1.0
Deliver_tolerance: 1.0

# ------------------------------------------------------------
# PAYLOAD RELEASE (bv_core/payload.py, docs/HITL/payload.md)
# ------------------------------------------------------------
# Enabled for flight. Set false to fly without payload hardware.
payload:
  enabled: false

  # Each servo = one zero_deg (where the horn sits on the spline) plus fixed
  # offsets (the mechanism's geometry, never change). After re-mounting a
  # horn, measure its new zero with the bench tool and enter it here; every
  # position of that servo moves with it (docs/HITL/payload.md).
  # Degrees -> pulse uses Arduino Servo.write()'s mapping, so the flight
  # controller emits the pulses that were tested on the bench.
  arduino_pulse_range_us: [544, 2400]   # AVR Servo library: 0-180 deg

  slider:
    actuator_set: 1          # PWM_MAIN_FUNCn = 301 (Peripheral via Actuator Set 1)
    # zero = the beacon release. 100 matches the horn as mounted for the
    # Arduino test; RE-ZERO before flight (bottle at zero+70 must fit the range).
    zero_deg: 100
    beacon_offset_deg: 0     # drops the beacon (tent)
    hold_offset_deg: 30      # holds both payloads
    bottle_offset_deg: 70    # drops the bottle (person)
    # MUST equal PWM_MAIN_MINn / PWM_MAIN_MAXn on this output. 800-2200 us
    # reaches ~25-160 deg, so zero_deg must be ~25-90 for zero+70 to fit;
    # ~55-60 leaves margin on both sides. With zero 100 the bottle needs 170
    # deg and mission_node refuses to start until the horn is re-zeroed.
    pwm_range_us: [800, 2200]

  brake:
    actuator_set: 2          # PWM_MAIN_FUNCn = 302 (Peripheral via Actuator Set 2)
    zero_deg: 107            # zero = the pulse position
    pulse_offset_deg: 0      # toggled against rest during a drop
    rest_offset_deg: 18      # rest (125 deg with this zero)
    pwm_range_us: [800, 2200]

  # The brake toggles pulse <-> rest every toggle_ms; each phase lasts
  # drop_ft / speed_ftps seconds. The drops should sum to the delivery
  # altitude (150 ft = 45.72 m); mission_node warns at startup if not.
  brake_phases:
    - {drop_ft: 75, speed_ftps: 15.0, toggle_ms: 200}   # 5.00 s
    - {drop_ft: 50, speed_ftps: 13.3, toggle_ms: 150}   # 3.76 s
    - {drop_ft: 25, speed_ftps: 12.5, toggle_ms: 100}   # 2.00 s

Approval_required: true
Approval_timeout_sec: 180.0
